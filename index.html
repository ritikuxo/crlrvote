<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College CR & LR Election Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { color: #2c3e50; font-size: 2.5rem; margin-bottom: 10px; }
        header p { color: #7f8c8d; font-size: 1.1rem; }
        .panels { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; }
        .panel { flex: 1; min-width: 300px; max-width: 380px; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; transition: transform 0.3s ease; animation: slideUp 0.6s ease forwards; opacity: 0; }
        .panel:hover { transform: translateY(-5px); box-shadow: 0 15px 50px rgba(0,0,0,0.15); }
        .panel-header { padding: 25px; color: white; text-align: center; }
        .panel-header h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .panel-header p { font-size: 0.9rem; opacity: 0.9; }
        .panel-body { padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-align: left; }
        .btn:hover { transform: translateX(5px); opacity: 0.95; }
        .btn:active { transform: scale(0.98); }
        .btn i { margin-right: 10px; width: 20px; text-align: center; }
        .candidate .panel-header { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); }
        .candidate .btn { background: #f8f9fa; color: #2c3e50; border: 2px solid #e9ecef; }
        .candidate .btn:hover { background: #2ecc71; color: white; border-color: #27ae60; }
        .voter .panel-header { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }
        .voter .btn { background: #f8f9fa; color: #2c3e50; border: 2px solid #e9ecef; }
        .voter .btn:hover { background: #3498db; color: white; border-color: #2980b9; }
        .admin .panel-header { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .admin .btn { background: #f8f9fa; color: #2c3e50; border: 2px solid #e9ecef; }
        .admin .btn:hover { background: #e74c3c; color: white; border-color: #c0392b; }
        .divider { height: 1px; background: #ecf0f1; margin: 10px 0; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-open { background: #d4edda; color: #155724; }
        .badge-active { background: #cce5ff; color: #004085; }
        .badge-admin { background: #f8d7da; color: #721c24; }
        footer { text-align: center; margin-top: 50px; color: #7f8c8d; font-size: 0.9rem; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .candidate { animation-delay: 0.1s; } .voter { animation-delay: 0.2s; } .admin { animation-delay: 0.3s; }
        @media (max-width: 768px) { .panels { flex-direction: column; align-items: center; } .panel { max-width: 100%; width: 100%; } header h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>College CR & LR Election Portal</h1>
            <p>Select your role to continue</p>
        </header>

        <div class="panels">
            <!-- Candidate Panel -->
            <div class="panel candidate">
                <div class="panel-header">
                    <span class="badge badge-open">Nominations Open</span>
                    <h2>Candidate</h2>
                    <p>Nominate yourself for CR or LR post</p>
                </div>
                <div class="panel-body">
                    <button class="btn" onclick="alert('Coming Soon: Candidate Registration Form')"><i>📝</i> Register as Candidate</button>
                    <button class="btn" onclick="alert('Coming Soon: View All Candidates')"><i>👥</i> View All Candidates</button>
                    <button class="btn" onclick="alert('Coming Soon: Check Nomination Status')"><i>✅</i> Check Nomination Status</button>
                    <button class="btn" onclick="alert('Coming Soon: Withdraw Nomination')"><i>❌</i> Withdraw Nomination</button>
                    <div class="divider"></div>
                    <button class="btn" style="background: #2ecc71; color: white; border: none; text-align: center;" onclick="alert('Coming Soon: Campaign Dashboard')"><i>📊</i> Campaign Dashboard</button>
                </div>
            </div>

            <!-- Voter Panel -->
            <div class="panel voter">
                <div class="panel-header">
                    <span class="badge badge-active">Voting Active</span>
                    <h2>Voter</h2>
                    <p>Cast your vote for CR & LR</p>
                </div>
                <div class="panel-body">
                    <button class="btn" onclick="alert('Coming Soon: Voter Login / Roll Number Verification')"><i>🔐</i> Login / Verify Identity</button>
                    <button class="btn" onclick="alert('Coming Soon: View Candidate Profiles')"><i>📋</i> View Candidate Profiles</button>
                    <button class="btn" onclick="alert('Coming Soon: Cast Your Vote')"><i>🗳️</i> Cast Vote for CR & LR</button>
                    <button class="btn" onclick="alert('Coming Soon: Voting Receipt')"><i>🧾</i> Download Voting Receipt</button>
                    <div class="divider"></div>
                    <button class="btn" style="background: #3498db; color: white; border: none; text-align: center;" onclick="alert('Coming Soon: Check Voting Status')"><i>✓</i> Check If You Voted</button>
                </div>
            </div>

            <!-- Admin Panel -->
            <div class="panel admin">
                <div class="panel-header">
                    <span class="badge badge-admin">Admin Access</span>
                    <h2>Admin</h2>
                    <p>Manage election and results</p>
                </div>
                <div class="panel-body">
                    <button class="btn" onclick="alert('Coming Soon: Admin Login')"><i>🔑</i> Admin Login</button>
                    <button class="btn" onclick="alert('Coming Soon: Approve/Reject Nominations')"><i>✅</i> Approve Nominations</button>
                    <button class="btn" onclick="alert('Coming Soon: Manage Voter List')"><i>👥</i> Manage Voter List</button>
                    <button class="btn" onclick="alert('Coming Soon: Start/Stop Election')"><i>⚙️</i> Start / Stop Election</button>
                    <div class="divider"></div>
                    <button class="btn" style="background: #e74c3c; color: white; border: none; text-align: center;" onclick="alert('Coming Soon: Declare Results')"><i>🏆</i> Declare Results</button>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 College CR & LR Election Portal. All rights reserved.</p>
        </footer>
    </div>

    <script>
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                this.style.opacity = '0.7';
                setTimeout(() => { this.style.opacity = '1'; }, 200);
            });
        });
    </script>
</body>
</html>
